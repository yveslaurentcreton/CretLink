[package]
name = "cretlink-relay"
description = "Opaque outbound-rendezvous forwarding backbone for the CretLink internet relay (M007)"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Frame ceiling only (REQ-N-012). The relay forwards opaque bytes and never
# decodes a protocol message, so this is the single dependency on the core.
cretlink-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
# High-entropy addressing-only rendezvous tickets (ADR-0016). `rand` supplies
# OS randomness, `subtle` a constant-time ticket compare, `zeroize` erases the
# ticket bytes on drop. No secure-channel cryptography lives here — the relay
# never holds a session key.
rand.workspace = true
subtle.workspace = true
zeroize.workspace = true
# HKDF-SHA256 derives the rendezvous ticket from the seed of a relay code and
# the relay's host name (ST-M007-012). The same RustCrypto crates the secure
# channel already uses for the Session Approval Code; the relay server itself
# never derives a ticket and still holds no session key.
hkdf.workspace = true
sha2.workspace = true

[dev-dependencies]
# The forwarding tests drive the *real* Noise XX pairing and secure channel
# (ADR-0003) end to end through the relay splice, proving the relay only ever
# sees ciphertext and cannot synthesize an authenticated endpoint.
cretlink-transport.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
