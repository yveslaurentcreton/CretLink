[package]
name = "cretlink-protocol"
description = "Versioned CretLink protocol schemas: session, request, response, event, error, cancellation, and capability messages"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64.workspace = true
# SAC derivation (ADR-0003): SHA-256 commitment and HKDF-SHA256 code
# derivation. `zeroize` erases the transient HKDF input keying material.
hkdf.workspace = true
# Reboot-resume continuity proof (ADR-0014): HMAC-SHA256 over the transcript,
# ticket id, and reconnect nonce, compared in constant time.
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

