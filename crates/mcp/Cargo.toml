[package]
name = "cretlink-mcp"
description = "Local MCP bridge exposing generic remote-computer primitives for the selected CretLink session"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
cretlink-protocol.workspace = true
async-trait = "0.1"
base64.workspace = true
rmcp = { workspace = true }
schemars = "1"
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
# `net` adds the same-user local IPC carriers (Windows named pipe / Unix domain
# socket) for the bridge-console link (ADR-0004); the other features come from
# the workspace definition. Feature unification keeps one tokio build.
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
# A dev-dependency cycle back onto cretlink-mcp (via cretlink-console) is
# permitted by cargo; apps are deliberately not in [workspace.dependencies].
cretlink-console = { path = "../../apps/console", version = "0.0.0" }
cretlink-simulator.workspace = true

[lints]
workspace = true
