[package]
name = "cretlink-simulator"
description = "Non-privileged simulated CretLink target for safe development and CI testing"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
cretlink-protocol.workspace = true
cretlink-transport.workspace = true
# The simulated target answers file operations by running the real FileStore
# engine against a private temp directory, so the staging/commit/verify/cleanup
# discipline behaves exactly as on a real agent (ST-M003-004/005, ADR-0012).
cretlink-exec.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The VFS tests commit staged bytes, which requires a matching SHA-256 digest.
sha2.workspace = true

[lints]
workspace = true
