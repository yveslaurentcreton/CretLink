[package]
name = "cretlink-transport"
description = "Authenticated encrypted session transport and framing for CretLink"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
cretlink-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Secure channel (ADR-0003, ST-M002-004). We compose the `snow` Noise
# implementation with RustCrypto/`subtle`/`zeroize` primitives and invent no
# cryptography of our own: `snow` runs the Noise_XX_25519_ChaChaPoly_SHA256
# handshake and record layer, `rand` supplies OS randomness for the pairing
# nonces, `subtle` gives the constant-time commitment compare, and `zeroize`
# erases nonce/secret bytes on drop. The Session Approval Code derivation and
# the pairing message schema live in `cretlink-protocol`.
snow.workspace = true
rand.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
