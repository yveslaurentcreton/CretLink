[package]
name = "cretlink-console"
description = "The technician role of CretLink (Give help): session management, audit and MCP bridge host, plus the `cretlink-console` development tool"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
cretlink-discovery.workspace = true
cretlink-mcp.workspace = true
cretlink-protocol.workspace = true
cretlink-session.workspace = true
cretlink-shared.workspace = true
cretlink-transport.workspace = true
async-trait = "0.1"
serde = { workspace = true }
# The session history reads the audit files back (ST-M009-012).
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
uuid = { workspace = true }

# The technician's full name on Windows (ST-M009-011): the same `windows`
# version the support agent already uses, with the two API families the
# display-name lookup needs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security_Authentication_Identity",
] }

[dev-dependencies]
# The technician's file actions are tested against the agent's real file store
# (ST-M010-001): the tests plant folders in the staging area it reports.
cretlink-exec.workspace = true
cretlink-simulator.workspace = true
# The full-chain MCP e2e test (ST-M004-*) drives a real rmcp client against the
# bridge, decodes base64 tool output, and needs the net-backed IPC transport.
base64.workspace = true
rmcp = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "net"] }

[lints]
workspace = true
