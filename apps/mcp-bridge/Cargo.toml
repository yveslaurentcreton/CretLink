[package]
name = "cretlink-mcp-bridge"
description = "Thin stdio MCP bridge: exposes the CretLink console's selected, consented session to an MCP client (ADR-0004)"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

# The MCP client spawns this executable as `cretlink-mcp[.exe]` over stdio.
[[bin]]
name = "cretlink-mcp"
path = "src/main.rs"
doc = false

[dependencies]
# `serve_stdio` serves the McpBridge over the stdio transport (rmcp server +
# transport-io), shared with `cretlink mcp` (ST-M009-002).
cretlink-mcp.workspace = true
tokio = { workspace = true }

[dev-dependencies]
# ST-M004-005 client-interop conformance harness. It spawns the shipped
# `cretlink-mcp` binary and speaks RAW JSON-RPC (no rmcp client types) to model
# an independently implemented client such as Codex CLI, then drives the full
# console path for the positive full-chain test — hence the console/session
# crates and the net-backed IPC transport.
cretlink-protocol.workspace = true
cretlink-session.workspace = true
# The console is an application crate, not a workspace library dependency, so it
# is referenced by path (test-only, for the positive full-chain path).
cretlink-console = { path = "../console", version = "0.0.0" }
base64.workspace = true
serde_json.workspace = true
# `process` spawns the binary; `net` backs the console's loopback TCP + IPC.
tokio = { workspace = true, features = ["process", "net"] }
# Compiles every advertised tool input schema as a real JSON Schema, proving an
# independent client can consume them. Exact-pinned (cargo-deny denies
# wildcards); MIT-licensed; default features off to drop the HTTP/TLS `$ref`
# resolvers the self-contained schemas never need.
jsonschema = { version = "=0.49.9", default-features = false }

[lints]
workspace = true
