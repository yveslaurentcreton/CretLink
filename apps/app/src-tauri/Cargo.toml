[package]
name = "cretlink-app"
description = "The one CretLink application (Tauri v2): Give help (technician) and, on Windows, Get help (customer), plus the command-line subcommands (ST-M009-005, ADR-0018)"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/yveslaurentcreton/CretLink"
authors = ["Yves-Laurent Creton"]
publish = false
default-run = "cretlink"

# Detached from the root Cargo workspace on purpose (ADR-0011): Tauri's large
# dependency tree and the Linux webview system libraries must never enter the
# portable core's cross-platform `cargo build/test --workspace` matrix. The
# automated, cross-platform-verified state models live in `cretlink-console`
# and `cretlink-support-agent`, which this crate depends on by path.
[workspace]

[lib]
# Keep the app logic in a library so it can be unit-tested; `main.rs` is a thin
# entry point.
name = "cretlink_app"
crate-type = ["lib"]

# The application is `cretlink` (`cretlink.exe`), built for the Windows GUI
# subsystem (ADR-0018).
[[bin]]
name = "cretlink"
path = "src/main.rs"

[features]
# OFF by default so the shipped release exe opens real transport only and
# compiles OUT the simulated seed targets, the simulated consent demo and the
# fabricated-consent commands (ST-M002-009, AC #4). Enable locally with
# `--features dev-simulate` to drive either role's state machine without a
# peer. Never enabled for a release build.
dev-simulate = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The subcommands (`mcp`, `mcp install`, `version`, …) shared with the console
# build `cretlink-cli`, and the Windows process plumbing (attach to the parent
# console, elevated relaunch). `gui-subsystem` makes them behave as the
# GUI-subsystem program this is (ST-M009-001).
cretlink-cli = { path = "../../cli", features = ["gui-subsystem"] }
# Technician role: the console state machine and session service.
cretlink-console = { path = "../../console" }
# Customer role: the agent-side state machine, honest identity and broker.
cretlink-support-agent = { path = "../../support-agent" }
cretlink-protocol = { path = "../../../crates/protocol" }
# The real LAN transport (listening host for the technician, dialing initiator
# for the customer) and the private-interface / connection-code helpers
# (ST-M002-009).
cretlink-session = { path = "../../../crates/session" }
cretlink-discovery = { path = "../../../crates/discovery" }
# The same-user local IPC endpoint the MCP bridge dials. The technician role
# binds `IpcEndpoint::user_default()`, so the application is the single
# consented session the bridge and the technician terminal route through
# (ST-M004-007).
cretlink-mcp = { path = "../../../crates/mcp" }
tauri = { version = "2", features = [] }
# The pumps run on Tauri's own runtime (`tauri::async_runtime`) and `select!`
# the live handle against the intent channels; `time` bounds the teardown of the
# audit service and IPC server (ST-M004-007); `rt-multi-thread` runs the
# subcommands before any window exists.
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }

# Test-only: the audit vocabulary used to construct sample `AuditEntry` records
# for the technician activity-mapping unit tests (ST-M004-007).
[dev-dependencies]
cretlink-shared = { path = "../../../crates/shared" }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
