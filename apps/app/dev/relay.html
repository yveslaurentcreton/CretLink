<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CretLink relay screens (dev)</title>
  </head>
  <body>
    <!-- Development only (ST-M007-011, ST-M007-013): the technician's window
         with a copy and a relay that are held in memory, with Tauri replaced
         by its own mocks. The real controller and views run; nothing is
         read, written or dialled. Not part of the production build, which
         builds only ../index.html. Serve with `npx vite` and open
         /dev/relay.html, then Settings, or Start a session and Use relay.
         `?copy=` picks the copy (installed, kept, file, file-problem,
         run-once), `?relay=` how the relay answers (admit, key, down),
         `?customer=` what the customer does once the relay holds the code
         (nothing, arrives, lost). -->
    <div id="app" aria-busy="true"></div>
    <script type="module" src="./relay.ts"></script>
  </body>
</html>
