         and a relay that are held in memory, with Tauri replaced by its own
         mocks. The real controller and views run; nothing is read, written
         or dialled. Not part of the production build, which builds only
         ../index.html. Serve with `npx vite` and open /dev/relay.html, then
         Settings. `?copy=` picks the copy (installed, kept, file,
         file-problem, run-once), `?relay=` how the relay answers a test
         (admit, key, down). -->
