[package]
name = "cretlink-agent-gui"
description = "CretLink Agent consent window (Tauri v2) over the shared agent-side session state model (ST-M002-005)"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/yveslaurentcreton/CretLink"
authors = ["Yves-Laurent Creton"]
publish = false

# Detached from the root Cargo workspace on purpose (ADR-0011), exactly like the
# console GUI: Tauri's large dependency tree and the platform webview system
# libraries must never enter the portable core's cross-platform
# `cargo build/test --workspace` matrix. The automated, cross-platform-verified
# state model lives in `cretlink-support-agent`, which this crate depends on by
# path and renders faithfully.
[workspace]

[lib]
# Keep the window's command logic in a library so it can be unit-tested;
# `main.rs` is a thin entry point.
name = "cretlink_agent_gui"
crate-type = ["lib"]

[features]
# OFF by default so the shipped release exe dials real transport only and
# compiles OUT the simulated consent demo and its demo-only commands
# (ST-M002-009, AC #4). Enable locally with `--features dev-simulate` to preview
# the disclosure and decision without a technician. Never enabled for a release
# build.
dev-simulate = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cretlink-support-agent = { path = "../../support-agent" }
cretlink-session = { path = "../../../crates/session" }
cretlink-protocol = { path = "../../../crates/protocol" }
cretlink-discovery = { path = "../../../crates/discovery" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `select!` over the live event stream and the button-intent channel, plus the
# `mpsc` channel itself. The async runtime is provided by Tauri (also Tokio), so
# only the `macros` and `sync` features are pulled in here.
tokio = { version = "1", features = ["macros", "sync"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
