# Continuous verification for CretLink (ST-M001-004).
#
# Third-party actions are pinned to full commit SHAs so a moved tag cannot
# change what runs in CI (REQ-S-019 provenance posture).
#
# Privileged Windows tests (real UAC, elevation, SYSTEM brokers) never run
# here: routine tests use the non-privileged simulator (REQ-N-011). Tests that
# genuinely need administrator rights must be marked `#[ignore]` and run only
# manually on a maintainer machine.
#
# CI minutes are limited while the repository is private, so a change is
# verified once (ST-M006-017):
#
# - No run on a push to main. The pull request run tests the merge result, a
#   pull request is merged only when it is up to date with main
#   (docs/releasing.md), and release.yml builds the tagged commit. The push
#   trigger returns when the repository is public and the minutes are free.
# - A newer push to a pull request cancels the run in progress for it.
# - A pull request that changes only documentation does not start this
#   workflow. hygiene.yml has no path filter and runs the secret scan and the
#   private-data check on every pull request. A workflow that a path filter
#   skips leaves its checks pending, which blocks a pull request once branch
#   protection requires them: revisit the filter before requiring these jobs.
#
# Every job has a time limit, so a hung runner cannot use up the allowance.

name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # ST-M009-001: the same `cretlink` built for the Windows GUI subsystem, as
      # the one application will be (ADR-0018), must still serve MCP over
      # redirected stdio; the conformance harness runs against it.
      - name: Test cretlink as a GUI-subsystem build
        if: runner.os == 'Windows'
        run: cargo test -p cretlink-cli --features gui-subsystem --locked

  # The one CretLink application (ST-M009-005) is a detached Tauri crate with a
  # Vite frontend, outside the workspace (ADR-0011), so it gets its own job on
  # every platform: frontend build, format, lint, tests, and an embedded-asset
  # build like the release one. Linux builds on Ubuntu 22.04, like the release,
  # so the binaries keep the glibc 2.35 baseline (ST-M009-013, REQ-N-021).
  app:
    name: Application (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri -> target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: cargo fmt --check
        working-directory: apps/app/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/app/src-tauri
      - run: cargo clippy --locked --all-targets --features dev-simulate -- -D warnings
        working-directory: apps/app/src-tauri
      - run: cargo test --locked
        working-directory: apps/app/src-tauri
      - run: cargo build --locked --features tauri/custom-protocol
        if: runner.os != 'Linux'
        working-directory: apps/app/src-tauri
      # ST-M009-013: the glibc baseline check and the Debian 12 smoke test on
      # `cretlink` and `cretlink-cli`, staged in a folder as the archive holds
      # them. `cretlink-cli` is a path dependency of the application, so one
      # cargo invocation builds both binaries from the same compiled crates
      # (its `gui-subsystem` feature, unified from the application, has no
      # effect off Windows).
      - name: Build and stage cretlink and cretlink-cli (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/app/src-tauri
        run: |
          cargo build --locked --features tauri/custom-protocol -p cretlink-app -p cretlink-cli
          mkdir -p "$RUNNER_TEMP/cretlink"
          cp target/debug/cretlink target/debug/cretlink-cli "$RUNNER_TEMP/cretlink/"
      - name: Check the glibc baseline (Linux)
        if: runner.os == 'Linux'
        run: bash ../../scripts/check-glibc.sh "$RUNNER_TEMP/cretlink"
      - name: Start on Debian 12 (Linux)
        if: runner.os == 'Linux'
        run: bash ../../scripts/smoke-debian.sh "$RUNNER_TEMP/cretlink"

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # MSRV per ADR-0002
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-toolchain.toml selects `stable`, which overrides the default the
      # action sets; `+1.95` makes this job compile on the MSRV itself.
      - run: cargo +1.95 check --workspace --locked

  deny:
    name: Dependency licenses, advisories, and sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources
