# Continuous verification for CretLink (ST-M001-004).
#
# Third-party actions are pinned to full commit SHAs so a moved tag cannot
# change what runs in CI (REQ-S-019 provenance posture).
#
# Privileged Windows tests (real UAC, elevation, SYSTEM brokers) never run
# here: routine tests use the non-privileged simulator (REQ-N-011). Tests that
# genuinely need administrator rights must be marked `#[ignore]` and run only
# manually on a maintainer machine.
#
# When it runs and what it reports (ST-M006-017):
#
# - On every pull request and on every push to main. The workflow has no path
#   filter: a workflow that a filter skips leaves its checks pending, and the
#   ruleset on main requires the "CI result" check of every pull request.
# - The "Changed areas" job says what the change touches
#   (scripts/changed-areas.mjs). The build and test jobs are skipped only when
#   it says that the change holds nothing but documentation (`*.md`, `docs/`,
#   `LICENSE`) or the documentation site (`website/`), and the job of the site
#   only when the change does not touch it. hygiene.yml runs the secret scan
#   and the private-data check on every pull request.
# - "CI result" always runs and fails when a job before it failed or was
#   cancelled; a skipped job does not fail it. Require this one check, never
#   the single jobs, so that a skipped job cannot block a pull request.
# - A newer push to a pull request cancels the run in progress for it. A run
#   on main is never cancelled.
#
# Every job has a time limit, so a hung runner cannot hold a run open.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      website: ${{ steps.areas.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # A pull request is compared with its base, a push with the commit that
      # was the head before it. Without a usable base the script reports every
      # area as changed.
      - name: List the changed areas
        id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/changed-areas.mjs "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/areas.txt"
          cat "$RUNNER_TEMP/areas.txt"
          cat "$RUNNER_TEMP/areas.txt" >> "$GITHUB_OUTPUT"

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # ST-M009-001: the same `cretlink` built for the Windows GUI subsystem, as
      # the one application will be (ADR-0018), must still serve MCP over
      # redirected stdio; the conformance harness runs against it.
      - name: Test cretlink as a GUI-subsystem build
        if: runner.os == 'Windows'
        run: cargo test -p cretlink-cli --features gui-subsystem --locked

  # The one CretLink application (ST-M009-005) is a detached Tauri crate with a
  # Vite frontend, outside the workspace (ADR-0011), so it gets its own job on
  # every platform: frontend build, format, lint, tests, and an embedded-asset
  # build like the release one. Linux builds on Ubuntu 22.04, like the release,
  # so the binaries keep the glibc 2.35 baseline (ST-M009-013, REQ-N-021).
  app:
    name: Application (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/app/src-tauri -> target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The step has its own limit: a package server that does not answer
      # would otherwise hold the job until the job's limit.
      - name: Install the webview libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: cargo fmt --check
        working-directory: apps/app/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/app/src-tauri
      - run: cargo clippy --locked --all-targets --features dev-simulate -- -D warnings
        working-directory: apps/app/src-tauri
      - run: cargo test --locked
        working-directory: apps/app/src-tauri
      - run: cargo build --locked --features tauri/custom-protocol
        if: runner.os != 'Linux'
        working-directory: apps/app/src-tauri
      # ST-M009-013: the glibc baseline check and the Debian 12 smoke test on
      # `cretlink` and `cretlink-cli`, staged in a folder as the archive holds
      # them. `cretlink-cli` is a path dependency of the application, so one
      # cargo invocation builds both binaries from the same compiled crates
      # (its `gui-subsystem` feature, unified from the application, has no
      # effect off Windows).
      - name: Build and stage cretlink and cretlink-cli (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/app/src-tauri
        run: |
          cargo build --locked --features tauri/custom-protocol -p cretlink-app -p cretlink-cli
          mkdir -p "$RUNNER_TEMP/cretlink"
          cp target/debug/cretlink target/debug/cretlink-cli "$RUNNER_TEMP/cretlink/"
      - name: Check the glibc baseline (Linux)
        if: runner.os == 'Linux'
        run: bash ../../scripts/check-glibc.sh "$RUNNER_TEMP/cretlink"
      - name: Start on Debian 12 (Linux)
        if: runner.os == 'Linux'
        run: bash ../../scripts/smoke-debian.sh "$RUNNER_TEMP/cretlink"

  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # MSRV per ADR-0002
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-toolchain.toml selects `stable`, which overrides the default the
      # action sets; `+1.95` makes this job compile on the MSRV itself.
      - run: cargo +1.95 check --workspace --locked

  # Every locked dependency is checked (ST-M006-019): the Cargo workspace; the
  # application package, which is detached and has a lockfile and a
  # configuration of its own (apps/app/src-tauri/deny.toml); the npm packages
  # of the application's frontend and of the release tooling. The npm packages
  # of the documentation site are audited in its own job below.
  deny:
    name: Dependency licenses, advisories, and sources
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workspace (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources
      - name: Check the application package (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/app/src-tauri/Cargo.toml
          arguments: --all-features --config apps/app/src-tauri/deny.toml
          command: check licenses advisories bans sources
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # `npm audit` reads the lockfile and asks the registry; nothing is
      # installed. For the frontend any advisory fails, also in what only
      # builds and tests it.
      - name: Audit the application's frontend (npm)
        working-directory: apps/app
        run: npm audit
      # The release tooling packs a package manager with dependencies that no
      # lockfile here can move, so its check fails on an advisory of high or
      # critical severity that has a fix (scripts/check-npm-audit.mjs).
      - name: Audit the release tooling (npm)
        run: node scripts/check-npm-audit.mjs

  # The documentation site (ST-M011-001): its build, the tests of its check,
  # and the check of every link and picture of the built pages. pages.yml
  # publishes it from main.
  website:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.website != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build
      - run: node --test "scripts/*.test.mjs"
      - run: npm run check

  # The relay server as a container image (ST-M007-015, REQ-N-023), on both
  # architectures it is published for, each on a runner of that architecture.
  # The image is built from apps/relay-server/Dockerfile exactly as a release
  # builds it and then run: one program on an empty base, a user without
  # rights, a read-only root file system, and a rendezvous over wss with a
  # mounted certificate and key file (apps/relay-server/tests/relay_image.rs).
  # Nothing is pushed anywhere: only the release workflow publishes.
  image:
    name: Relay server image (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the image
        run: docker build --file apps/relay-server/Dockerfile --tag cretlink-relay-server:test .
      - name: Run the image
        env:
          CRETLINK_RELAY_IMAGE: cretlink-relay-server:test
        run: cargo test --locked -p cretlink-relay-server --test relay_image -- --ignored

  # The one check the ruleset on main requires from this workflow. It runs
  # whatever happened before it: a failed or cancelled job fails it, a skipped
  # job does not.
  result:
    name: CI result
    if: always()
    needs: [changes, lint, test, app, msrv, deny, website, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
