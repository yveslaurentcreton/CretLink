# Release automation for CretLink (ST-M001-005, extended by ST-M006-004).
#
# semantic-release derives versions from Conventional Commits on main
# (REQ-N-018) and publishes ONLY from this workflow on push to main: pull
# requests never run it and never hold a write-scoped token (REQ-S-020).
#
# The `version` job computes the version semantic-release will publish. The
# `build` matrix compiles the shippable binaries on each platform from the exact
# commit that semantic-release will tag, stamped with that version, and
# produces, per target, one archive for the operating system, the loose relay
# server, SHA-256 checksums, a dependency inventory, and a CycloneDX SBOM per
# binary (REQ-N-016, REQ-N-017, REQ-N-021, REQ-S-019). The `release` job gathers
# those artifacts and semantic-release attaches them to the GitHub release, so
# every official binary traces back to a tag with verifiable integrity.
#
# Third-party actions are pinned to full commit SHAs so a moved tag cannot
# change what runs (REQ-S-019 provenance posture).

name: Release

on:
  push:
    branches: [main]

# Read-only by default; only the publishing job is granted write, and only to
# the contents/issues/PRs semantic-release needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Determines the version semantic-release will publish before anything is
  # built, so the binaries and the per-OS archives carry it (ST-M006-014,
  # ST-M009-004). `semantic-release --dry-run` would need a token that may push;
  # scripts/next-version.mjs reaches the same decision with read-only access,
  # and scripts/verify-version.cjs makes semantic-release refuse to publish if
  # it ever decides differently. An empty version means nothing is released and
  # the remaining jobs are skipped.
  version:
    name: Next version
    if: github.repository == 'yveslaurentcreton/CretLink'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Compute the next version
        id: next
        shell: bash
        run: echo "version=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"

  build:
    name: Build artifacts (${{ matrix.os }})
    needs: version
    # Guard against forks: only the canonical repository builds release
    # artifacts, and only when there is something to release.
    if: github.repository == 'yveslaurentcreton/CretLink' && needs.version.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        # Linux builds on the oldest runner with webkit2gtk 4.1, so the archive
        # runs on glibc 2.35 or newer (ST-M009-013, REQ-N-021).
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The application (ST-M009-005) builds its frontend with npm and links
      # the platform webview.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the webview libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install cargo-cyclonedx (SBOM generator)
        shell: bash
        run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Build and stage the binaries
        shell: bash
        env:
          CRETLINK_VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/gen-artifacts.sh --stage "$CRETLINK_VERSION"
      # Authenticode-sign the Windows binaries when a signing identity is
      # configured (ST-M006-005). The secrets exist only on this protected
      # push-to-main path, never in pull-request jobs (REQ-S-019, REQ-S-020); with
      # no secret present the helper is a clean no-op and the build stays unsigned,
      # so development builds remain distinguishable from official ones (REQ-N-017).
      - name: Sign Windows artifacts (gated; no-op without a signing identity)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CRETLINK_SIGN_PFX_BASE64: ${{ secrets.CRETLINK_SIGN_PFX_BASE64 }}
          CRETLINK_SIGN_PFX_PASSWORD: ${{ secrets.CRETLINK_SIGN_PFX_PASSWORD }}
          CRETLINK_SIGN_TIMESTAMP_URL: ${{ secrets.CRETLINK_SIGN_TIMESTAMP_URL }}
        run: pwsh -File scripts/sign-windows.ps1
      # Checksums, the per-OS archive, the dependency inventory and the SBOMs,
      # over the (possibly signed) staged binaries (ST-M009-004).
      - name: Pack the archive and its metadata
        shell: bash
        env:
          CRETLINK_VERSION: ${{ needs.version.outputs.version }}
          # Official artifacts must carry their SBOMs; fail rather than ship without.
          CRETLINK_REQUIRE_SBOM: "1"
        run: bash scripts/gen-artifacts.sh --pack "$CRETLINK_VERSION"
      # Every shipped Linux binary — the archive and the loose relay server —
      # stays within the glibc 2.35 baseline, and the archive starts on
      # Debian 12 with the release version (ST-M009-013, REQ-N-021).
      - name: Check the glibc baseline (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-glibc.sh dist/cretlink-*-linux-*.tar.gz dist/cretlink-relay-server-*
      - name: Start the archive on Debian 12 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CRETLINK_VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/smoke-debian.sh --expect "$CRETLINK_VERSION" dist/cretlink-*-linux-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  # The relay server as a container image (ST-M007-015, REQ-N-023), for both
  # architectures, each built on a runner of that architecture from the commit
  # that semantic-release will tag and stamped with the version. The image is
  # run before anything is published (apps/relay-server/tests/relay_image.rs),
  # and the release below waits for it: a release never appears without an
  # image that passed. This job publishes nothing; it hands the tested image
  # and its bill of materials to `publish-image`.
  image:
    name: Relay server image (${{ matrix.arch }})
    needs: version
    if: github.repository == 'yveslaurentcreton/CretLink' && needs.version.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CRETLINK_VERSION: ${{ needs.version.outputs.version }}
      IMAGE: cretlink-relay-server:${{ needs.version.outputs.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the image
        run: |
          docker build --file apps/relay-server/Dockerfile \
            --build-arg "CRETLINK_VERSION=$CRETLINK_VERSION" --tag "$IMAGE" .
      - name: Run the image
        env:
          CRETLINK_RELAY_IMAGE: ${{ env.IMAGE }}
        run: cargo test --locked -p cretlink-relay-server --test relay_image -- --ignored
      # The program in the image reports the release version.
      - name: Check the version of the program
        run: test "$(docker run --rm "$IMAGE" --version)" = "cretlink-relay-server $CRETLINK_VERSION"
      - name: Install cargo-cyclonedx (SBOM generator)
        run: cargo install cargo-cyclonedx --locked --version 0.5.9
      # The bill of materials of the relay server for the target of this
      # image, with the release version as the version of its own component.
      - name: Write the bill of materials
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          (cd apps/relay-server && cargo cyclonedx --format json --target "$TARGET" \
            --override-filename cretlink-sbom)
          node -e '
            const fs = require("fs");
            const [from, to, version] = process.argv.slice(1);
            const sbom = JSON.parse(fs.readFileSync(from, "utf8"));
            if (!sbom.metadata || !sbom.metadata.component) throw new Error("no component in the SBOM");
            sbom.metadata.component.version = version;
            fs.writeFileSync(to, JSON.stringify(sbom, null, 2) + "\n");
          ' apps/relay-server/cretlink-sbom.json "$RUNNER_TEMP/image/sbom-$ARCH.cdx.json" "$CRETLINK_VERSION"
      - name: Save the image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "$IMAGE" --output "$RUNNER_TEMP/image/image-$ARCH.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 7

  release:
    name: semantic-release
    needs: [version, build, image]
    if: github.repository == 'yveslaurentcreton/CretLink' && needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Gather platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true
      # One checksum file over the per-OS archives of every target (REQ-N-021).
      - name: Checksum the archives
        shell: bash
        run: |
          cd dist
          sha256sum cretlink-*.zip cretlink-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRETLINK_EXPECTED_VERSION: ${{ needs.version.outputs.version }}

  # Publishes the relay server image that the `image` job built and ran
  # (ST-M007-015, REQ-N-023), once the release exists: the same bytes, for
  # amd64 and arm64, as ghcr.io/yveslaurentcreton/cretlink-relay-server with
  # the version and `latest` as tags, with a provenance attestation that names
  # this commit and a bill of materials for each architecture. Only this job
  # may write packages, and it runs for a release only: a pull request never
  # reaches it (REQ-S-020).
  publish-image:
    name: Publish the relay server image
    needs: [version, release]
    if: github.repository == 'yveslaurentcreton/CretLink' && needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CRETLINK_VERSION: ${{ needs.version.outputs.version }}
      REGISTRY_IMAGE: ghcr.io/yveslaurentcreton/cretlink-relay-server
    steps:
      - name: Gather the images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: image
          pattern: relay-image-*
          merge-multiple: true
      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      # Each architecture is pushed under a tag of its own; the version and
      # `latest` then name both, so that `docker pull` takes the right one.
      - name: Push the images
        id: push
        run: |
          for arch in amd64 arm64; do
            docker load --input "image/image-$arch.tar"
            docker tag "cretlink-relay-server:$CRETLINK_VERSION-$arch" "$REGISTRY_IMAGE:$CRETLINK_VERSION-$arch"
            docker push "$REGISTRY_IMAGE:$CRETLINK_VERSION-$arch"
            digest="$(docker buildx imagetools inspect "$REGISTRY_IMAGE:$CRETLINK_VERSION-$arch" --format '{{.Manifest.Digest}}')"
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
          docker buildx imagetools create \
            --tag "$REGISTRY_IMAGE:$CRETLINK_VERSION" --tag "$REGISTRY_IMAGE:latest" \
            "$REGISTRY_IMAGE:$CRETLINK_VERSION-amd64" "$REGISTRY_IMAGE:$CRETLINK_VERSION-arm64"
          digest="$(docker buildx imagetools inspect "$REGISTRY_IMAGE:$CRETLINK_VERSION" --format '{{.Manifest.Digest}}')"
          echo "index=$digest" >> "$GITHUB_OUTPUT"
          echo "published $REGISTRY_IMAGE:$CRETLINK_VERSION@$digest"
      - name: Attest the provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.index }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the bill of materials (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.amd64 }}
          sbom-path: image/sbom-amd64.cdx.json
          push-to-registry: true
      - name: Attest the bill of materials (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.arm64 }}
          sbom-path: image/sbom-arm64.cdx.json
          push-to-registry: true

