# Hygiene checks on every pull request (ST-M006-016, ST-M006-017).
#
# ci.yml skips its build and test jobs for a pull request that changes only
# documentation. This workflow skips nothing, because a secret or private data
# can sit in any file and in any commit message; it is one short job on a
# Linux runner, and the ruleset on main requires it.
#
# - Secret scan: gitleaks over the commits of the pull request (REQ-N-017).
# - Private-data check: scripts/check-private-data.mjs, after the tests of the
#   scripts, over the tracked files of the merge result and the commit
#   messages of the pull request (REQ-N-022). It runs without a list of
#   private terms: that list never leaves the maintainer's computer, where the
#   same check runs with it before a push.
#
# The job holds a read-only token and no secret (REQ-S-020). A newer push to
# the pull request cancels the run in progress for it.
#
# Third-party actions are pinned to full commit SHAs (REQ-S-019).

name: Hygiene

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Secret scan and private-data check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the scripts
        run: node --test "scripts/*.test.mjs"
      # The checkout is the merge commit of the pull request, with the whole
      # history. The commits of the pull request itself are those between its
      # base and its head; `:?` fails the step if either is missing, instead
      # of checking an empty range.
      - name: Check for private data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-private-data.mjs --commits "${BASE_SHA:?}..${HEAD_SHA:?}"
